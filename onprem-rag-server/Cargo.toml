[package]
name = "onprem-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1"
# Source-DB connectors. sqlx covers Postgres + MySQL; sqlx dropped MSSQL, so
# SQL Server goes through tiberius (TDS). rustls on both to avoid OpenSSL on Windows.
# The type features (json/chrono/bigdecimal/uuid) let WS5 decode arbitrary row
# columns to JSON: Postgres rows come back whole via `to_jsonb`; MySQL/MSSQL cells
# are decoded per-column by trying these concrete types in turn.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "json", "chrono", "bigdecimal", "uuid"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
# Encrypt source-DB credentials at rest (AES-256-GCM; key derived from the server key).
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
# Anchored regexes for the Tier-0 conversational gate (router). Compiled once via LazyLock.
regex = "1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
# Local embeddings (BGE-M3) + cross-encoder reranking, both via ONNX Runtime. Default
# ORT path only — the candle-backed `qwen3` feature is intentionally not enabled.
fastembed = "6"
# Foundry Local (chat) manager: native engine via libloading + async-openai client.
# No ort dependency, so no conflict with fastembed. `winml` feature added on Windows below.
foundry-local-sdk = "1"
# Re-exported by foundry-local-sdk but ChatCompletionTool (the inner wrapper around
# FunctionObject) is not re-exported, so we depend on it directly for Phase 3 tool
# construction. Pin to the same minor as foundry-local-sdk uses (0.33).
async-openai = { version = "0.33", default-features = false, features = ["chat-completion-types"] }
futures = "0.3.34"
jsonwebtoken = "9"
mongodb = "3.8.1"
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
# v7 = time-ordered UUIDs: every UUID we mint is a DocumentDB `_id` (users, sources,
# jobs), i.e. a database key indexed in Postgres underneath — v7 sorts by creation
# and keeps inserts local in the B-tree. (v4 random UUIDs would scatter them.)
uuid = { version = "1.25.0", features = ["v7", "serde"] }
# SQL AST parsing for the nl2sql policy gate (SELECT-only + dangerous-function checks).
sqlparser = { version = "0.53", default-features = false, features = ["std", "visitor"] }
# LRU cache for repeated embed_query calls (same query text -> cached vector).
lru = "0.12"
sysinfo = "0.39.6"
# Chat generation talks to the Foundry Local daemon over its OpenAI-compatible HTTP API rather
# than the SDK's in-process core, which fail-fasts this process on concurrent requests
# (plans/docs/foundry-local-webgpu-concurrency-crash.md). `stream` is what makes SSE token
# streaming possible without buffering the whole completion.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Reassembling SSE records from a byte stream reads far better as a generator than as an
# `unfold` over a hand-rolled state machine. Already in the tree via Rocket; made direct.
async-stream = "0.3"

# Windows uses the WinML-backed native engine loader for Foundry Local.
[target.'cfg(windows)'.dependencies]
foundry-local-sdk = { version = "1", features = ["winml"] }
